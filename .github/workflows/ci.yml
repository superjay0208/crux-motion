name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run assets:prepare
      - run: npm run check
      - run: npm run campaign:check
      - run: npm run build
      - run: npx playwright install chromium
      - run: CRUX_CI=1 npm run web:check
        env:
          CRUX_CI: "1"
