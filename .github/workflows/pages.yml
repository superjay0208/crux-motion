name: Validate and publish Crux Motion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run assets:prepare
      - run: npm run check
      - run: npm run campaign:check
      - run: npm run build
      - run: npx playwright install chromium
      - run: CRUX_CI=1 npm run web:check
        env:
          CRUX_CI: "1"
      - run: CRUX_CI=1 node scripts/validate-web.mjs
        env:
          CRUX_CI: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
